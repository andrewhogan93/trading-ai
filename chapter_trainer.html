<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Trainer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #1a1a2e;
      --bg2:    #16213e;
      --bg3:    #0f3460;
      --accent: #e94560;
      --teal:   #a8dadc;
      --text:   #eee;
      --muted:  #7a8ba0;
      --border: rgba(168,218,220,0.12);
      --green:  #4ade80;
      --red:    #f87171;
      --radius: 10px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .wrapper { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    h1 { font-size: 1.2rem; letter-spacing: 3px; color: var(--accent); margin-bottom: 20px; }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    label, .field-label {
      font-size: 0.75rem; color: var(--muted); display: block;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    input[type="text"], input[type="password"] {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 0.85rem; padding: 8px 12px; outline: none; width: 100%;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: var(--teal); }
    .btn {
      background: var(--teal); color: #111; border: none; border-radius: 6px;
      padding: 9px 20px; font-weight: 700; font-size: 0.82rem; cursor: pointer; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 0.78rem; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-danger { background: transparent; border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .key-row { display: flex; gap: 8px; align-items: center; }
    .key-row input { flex: 1; }
    #keys-toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .keys-label { color: var(--muted); font-size: 0.82rem; }

    /* Header */
    #header-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    #chapter-title { flex: 1; min-width: 200px; }
    .file-label {
      display: inline-block; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 14px; font-size: 0.82rem; cursor: pointer;
      color: var(--teal); white-space: nowrap; font-weight: 600;
    }
    .file-label:hover { background: rgba(15,52,96,0.8); }
    #filename-display { color: var(--muted); font-size: 0.8rem; }
    #progress-wrap { width: 100%; margin-top: 12px; }
    #progress-bar-track { background: var(--bg); border-radius: 4px; height: 4px; margin-bottom: 6px; overflow: hidden; }
    #progress-bar-fill { background: var(--teal); height: 100%; width: 0%; transition: width 0.3s; }
    #progress-text { font-size: 0.78rem; color: var(--muted); }

    /* Previously trained chapters */
    #chapter-list-items { display: flex; flex-direction: column; gap: 8px; }
    .chapter-item {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px;
    }
    .chapter-item .ch-title { font-weight: 600; font-size: 0.85rem; }
    .chapter-item .ch-meta { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

    /* Page display */
    .section-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
    .pages-grid { display: flex; flex-direction: column; gap: 24px; }
    .page-wrap {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .page-label {
      padding: 8px 14px; background: var(--bg3);
      font-size: 0.78rem; color: var(--teal); font-weight: 700; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .page-hint { font-size: 0.72rem; color: var(--muted); font-weight: 400; letter-spacing: 0; }
    .page-img-container {
      position: relative;
      display: block;
      background: #0d0d16;
      cursor: crosshair;
      user-select: none;
    }
    .page-img-container img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    .page-overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      z-index: 2;
    }
    .selection-rect {
      position: absolute;
      border: 2px solid var(--teal);
      background: rgba(168, 218, 220, 0.12);
      pointer-events: none;
      z-index: 3;
    }

    /* Clips */
    #clips-section { margin-top: 8px; }
    .clip-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px; overflow: hidden;
    }
    .clip-card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; background: var(--bg3); border-bottom: 1px solid var(--border);
    }
    .clip-label { font-size: 0.8rem; color: var(--teal); font-weight: 700; }
    .clip-card-body { display: grid; grid-template-columns: 220px 1fr; }
    .clip-thumb {
      border-right: 1px solid var(--border); background: #0d0d16;
      padding: 10px; display: flex; align-items: flex-start; justify-content: center;
    }
    .clip-thumb img { width: 100%; height: auto; display: block; border-radius: 3px; }
    .clip-thumb .analyzing { color: var(--muted); font-size: 0.78rem; padding: 30px 0; text-align: center; }
    .clip-content { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .section-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .interp-text {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; font-size: 0.8rem; line-height: 1.7; color: var(--text);
      white-space: pre-wrap; max-height: 260px; overflow-y: auto;
    }
    .interp-text.loading { color: var(--muted); font-style: italic; }
    .clip-textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 0.82rem; font-family: inherit;
      padding: 8px 12px; resize: vertical; outline: none; line-height: 1.5; min-height: 72px;
    }
    .clip-textarea:focus { border-color: var(--teal); }

    /* Footer */
    #commit-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 12px 24px; display: none; align-items: center; gap: 16px; z-index: 100;
    }
    #clip-count { color: var(--muted); font-size: 0.82rem; flex: 1; }
    #commit-status { font-size: 0.82rem; }
    #commit-status.ok  { color: var(--green); }
    #commit-status.err { color: var(--red); }

    .note { font-size: 0.75rem; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    .muted { color: var(--muted); }

    @media (max-width: 640px) {
      .clip-card-body { grid-template-columns: 1fr; }
      .clip-thumb { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <h1>CHAPTER TRAINER</h1>

  <!-- Keys -->
  <div class="card" id="keys-card">
    <div id="keys-toggle-row">
      <span class="keys-label" id="keys-status-label">API Keys</span>
      <button class="btn btn-sm btn-ghost" id="keys-toggle-btn">Edit</button>
    </div>
    <div id="keys-fields" style="display:none; margin-top:14px;">
      <div style="margin-bottom:12px;">
        <label>Anthropic API Key</label>
        <div class="key-row">
          <input type="password" id="anthropic-key-input" placeholder="sk-ant-…">
          <button class="btn btn-sm" id="anthropic-save-btn">Save</button>
        </div>
      </div>
      <div>
        <label>GitHub Personal Access Token</label>
        <div class="key-row">
          <input type="password" id="gh-token-input" placeholder="github_pat_…">
          <button class="btn btn-sm" id="gh-token-save-btn">Save</button>
        </div>
        <p class="note">PAT needs Contents: Read &amp; Write on andrewhogan93/trading-ai</p>
      </div>
    </div>
  </div>

  <!-- Header: chapter title + upload -->
  <div class="card">
    <div id="header-bar">
      <input type="text" id="chapter-title" placeholder="Chapter title…">
      <label class="file-label">
        Upload PDF
        <input type="file" id="pdf-input" accept=".pdf" hidden>
      </label>
      <span id="filename-display" class="muted"></span>
    </div>
    <div id="progress-wrap" style="display:none; margin-top:12px;">
      <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
      <span id="progress-text"></span>
    </div>
  </div>

  <!-- Previously trained chapters -->
  <div class="card">
    <div class="section-title">Previously Trained Chapters</div>
    <div id="chapter-list-items"><span class="muted" style="font-size:0.82rem;">Loading…</span></div>
  </div>

  <!-- Pages -->
  <div id="pages-section" style="display:none;">
    <div class="section-title" style="margin-bottom:10px;">Pages — drag to select a chart or diagram</div>
    <div id="pages-grid" class="pages-grid"></div>
  </div>

  <!-- Selected clips -->
  <div id="clips-section" style="display:none; margin-top:24px;">
    <div class="section-title" id="clips-heading">Selected Clips</div>
    <div id="clips-container"></div>
  </div>
</div>

<div id="commit-footer">
  <span id="clip-count"></span>
  <button class="btn btn-accent" id="commit-btn" disabled>Commit Chapter</button>
  <span id="commit-status"></span>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── Constants ────────────────────────────────────────────────────────────────
const GH_OWNER = 'andrewhogan93';
const GH_REPO  = 'trading-ai';
const GH_PATH  = 'chapter_knowledge.json';
const LS_AK    = 'anthropic_api_key';
const LS_PAT   = 'gh_pat';

// ── State ────────────────────────────────────────────────────────────────────
let _chSha       = null;
let _pageResults = [];   // [{pageNum, dataUrl, imgWidth, imgHeight}]
let _clips       = [];   // [{id, pageNum, cropDataUrl, aiInterpretation, userRefinement}]
let _pdfFilename = '';
let _processing  = false;
let _drag        = null; // current drag state
let _clipCounter = 0;

// ── localStorage ─────────────────────────────────────────────────────────────
function getAnthropicKey() { return localStorage.getItem(LS_AK) || ''; }
function saveAnthropicKey(k) { localStorage.setItem(LS_AK, k); }
function getGithubToken()  { return localStorage.getItem(LS_PAT) || ''; }
function saveGithubToken(t){ localStorage.setItem(LS_PAT, t); }

// ── Keys card ────────────────────────────────────────────────────────────────
function updateKeysCardState() {
  const ak = getAnthropicKey(), tk = getGithubToken();
  const label = document.getElementById('keys-status-label');
  if (ak && tk) {
    label.textContent = 'API Keys — both saved ✓';
    document.getElementById('keys-fields').style.display = 'none';
  } else {
    const missing = [!ak && 'Anthropic key', !tk && 'GitHub token'].filter(Boolean).join(', ');
    label.textContent = `API Keys — missing: ${missing}`;
    document.getElementById('keys-fields').style.display = 'block';
  }
  if (ak) document.getElementById('anthropic-key-input').placeholder = '(saved)';
  if (tk) document.getElementById('gh-token-input').placeholder = '(saved)';
}

// ── Clip count / commit footer ───────────────────────────────────────────────
function updateClipCount() {
  const n = _clips.length;
  document.getElementById('clip-count').textContent =
    `${n} clip${n !== 1 ? 's' : ''} selected`;
  document.getElementById('commit-btn').disabled = n === 0;
  document.getElementById('commit-footer').style.display = n > 0 || _pageResults.length > 0 ? 'flex' : 'none';
  const heading = document.getElementById('clips-heading');
  if (heading) heading.textContent = `Selected Clips (${n})`;
}

// ── GitHub ───────────────────────────────────────────────────────────────────
async function loadChapterKnowledge(token) {
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  const r = await fetch(url, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message || ''}`);
  const json = await r.json();
  return { content: JSON.parse(atob(json.content.replace(/\n/g, ''))), sha: json.sha };
}

async function saveChapterKnowledge(token, data) {
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  try {
    const latest = await loadChapterKnowledge(token);
    _chSha = latest ? latest.sha : null;
  } catch (_) {}
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message: `chore: add/update chapter knowledge — ${_pdfFilename || 'chapter'}`, content: encoded };
  if (_chSha) body.sha = _chSha;
  const r = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.json()).message || ''}`);
  _chSha = (await r.json()).content.sha;
}

// ── Chapter list ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderChapterList(data, errorMsg) {
  const el = document.getElementById('chapter-list-items');
  if (errorMsg) { el.innerHTML = `<span style="color:var(--red);font-size:0.82rem;">Could not load: ${escHtml(errorMsg)}</span>`; return; }
  if (!data)    { el.innerHTML = `<span class="muted" style="font-size:0.82rem;">Loading…</span>`; return; }
  const chapters = data.chapters || [];
  if (!chapters.length) { el.innerHTML = `<span class="muted" style="font-size:0.82rem;">No chapters trained yet.</span>`; return; }
  el.innerHTML = chapters.map(ch => {
    const date  = ch.committed ? new Date(ch.committed).toLocaleDateString() : '';
    const items = (ch.clips || ch.pages || []).length;
    return `<div class="chapter-item">
      <div>
        <div class="ch-title">${escHtml(ch.title)}</div>
        <div class="ch-meta">${escHtml(ch.filename)} · ${date} · ${items} clip${items !== 1 ? 's' : ''}</div>
      </div>
      <span style="color:var(--green);font-size:0.8rem;">✓</span>
    </div>`;
  }).join('');
}

// ── PDF rendering ─────────────────────────────────────────────────────────────
async function renderPage(pdfDoc, pageNum) {
  const page = await pdfDoc.getPage(pageNum);
  let viewport = page.getViewport({ scale: 2.0 }); // higher scale = sharper for cropping
  const maxDim = 2400;
  if (viewport.width > maxDim || viewport.height > maxDim) {
    const clamp = Math.min(maxDim / viewport.width, maxDim / viewport.height);
    viewport = page.getViewport({ scale: 2.0 * clamp });
  }
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return { dataUrl, imgWidth: canvas.width, imgHeight: canvas.height };
}

// ── Crop a region from a stored dataUrl ─────────────────────────────────────
async function cropRegion(dataUrl, imgWidth, imgHeight, dispX, dispY, dispW, dispH, displayW, displayH) {
  const img = new Image();
  await new Promise(res => { img.onload = res; img.src = dataUrl; });
  const scaleX = imgWidth / displayW;
  const scaleY = imgHeight / displayH;
  const sx = Math.max(0, Math.round(dispX * scaleX));
  const sy = Math.max(0, Math.round(dispY * scaleY));
  const sw = Math.min(Math.round(dispW * scaleX), imgWidth - sx);
  const sh = Math.min(Math.round(dispH * scaleY), imgHeight - sy);
  const crop = document.createElement('canvas');
  crop.width  = sw;
  crop.height = sh;
  crop.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  return crop.toDataURL('image/jpeg', 0.92);
}

// ── Claude Vision: analyze a clip ────────────────────────────────────────────
async function analyzeClipWithClaude(base64, pageNum, chapterTitle, apiKey) {
  const prompt =
`You are analyzing a chart or diagram selected by the user from page ${pageNum} of a trading education book chapter titled "${chapterTitle}".

The user has cropped this specific region because it contains important trading knowledge they want you to learn. Analyze it thoroughly.

1. WHAT IS SHOWN
   Describe what you see: chart type, instrument/market (if labeled), time frame (if visible), overall price action or structure.

2. ANNOTATIONS INVENTORY — be exhaustive
   List every single annotation: arrows, text labels, callout boxes, drawn lines, trend lines, support/resistance levels, shaded zones, circles, brackets. For each one:
   - Quote the exact text if any
   - Describe precisely what it is marking or pointing to
   - Note its color and visual style

3. PATTERN OR CONCEPT BEING TAUGHT
   - What trading pattern, setup, or concept does this chart illustrate?
   - State the rule clearly: "When [condition], [action/expectation]"
   - What should a trader look for, do, or avoid based on this?

4. YOUR UNDERSTANDING
   Go beyond just describing labels. Demonstrate that you understand the nuance — what is the core insight a trader should internalize from this chart? What would make this setup valid vs invalid?`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: 1400,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
          { type: 'text', text: prompt },
        ],
      }],
    }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(`API ${res.status}: ${e.error?.message || res.statusText}`);
  }
  return (await res.json()).content[0].text.trim();
}

// ── Clip cards ────────────────────────────────────────────────────────────────
function buildClipCard(clip) {
  const card = document.createElement('div');
  card.className = 'clip-card';
  card.id = `clip-card-${clip.id}`;
  card.innerHTML = `
    <div class="clip-card-header">
      <span class="clip-label">Page ${clip.pageNum} — Clip #${clip.seq}</span>
      <button class="btn btn-sm btn-danger" style="margin-left:auto;" data-clip-id="${clip.id}">Remove</button>
    </div>
    <div class="clip-card-body">
      <div class="clip-thumb">
        <img src="${clip.cropDataUrl}" alt="Clip from page ${clip.pageNum}">
      </div>
      <div class="clip-content">
        <div>
          <div class="section-label">AI Analysis</div>
          <div class="interp-text loading" id="clip-interp-${clip.id}">Analyzing with Claude…</div>
        </div>
        <div>
          <div class="section-label">Your notes / corrections</div>
          <textarea class="clip-textarea" data-clip-id="${clip.id}"
            placeholder="Confirm, correct, or add context to the AI's analysis…" rows="4"></textarea>
        </div>
      </div>
    </div>`;
  return card;
}

function updateClipInterp(id, text, isError) {
  const el = document.getElementById(`clip-interp-${id}`);
  if (!el) return;
  el.classList.remove('loading');
  if (isError) el.style.color = 'var(--red)';
  el.textContent = text;
}

// ── Create a clip from a drag selection ──────────────────────────────────────
async function createClip(pageNum, dispX, dispY, dispW, dispH, displayW, displayH) {
  const pr = _pageResults.find(r => r.pageNum === pageNum);
  if (!pr) return;

  const apiKey       = getAnthropicKey();
  const chapterTitle = document.getElementById('chapter-title').value.trim();
  if (!apiKey) { alert('Anthropic API key not saved.'); return; }

  const cropDataUrl = await cropRegion(
    pr.dataUrl, pr.imgWidth, pr.imgHeight,
    dispX, dispY, dispW, dispH, displayW, displayH
  );

  _clipCounter++;
  const clip = { id: Date.now(), seq: _clipCounter, pageNum, cropDataUrl, aiInterpretation: '', userRefinement: '' };
  _clips.push(clip);

  const clipsSection = document.getElementById('clips-section');
  clipsSection.style.display = 'block';
  const card = buildClipCard(clip);
  document.getElementById('clips-container').appendChild(card);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateClipCount();

  // Analyze asynchronously
  try {
    const analysis = await analyzeClipWithClaude(cropDataUrl.split(',')[1], pageNum, chapterTitle, apiKey);
    clip.aiInterpretation = analysis;
    updateClipInterp(clip.id, analysis, false);
  } catch (e) {
    clip.aiInterpretation = `Error: ${e.message}`;
    updateClipInterp(clip.id, `Error: ${e.message}`, true);
  }
}

// ── Drag-to-select overlay ───────────────────────────────────────────────────
function attachSelectOverlay(overlayEl, pageNum) {
  overlayEl.addEventListener('mousedown', e => {
    if (_drag) return;
    e.preventDefault();
    const rect  = overlayEl.getBoundingClientRect();
    const startX = e.clientX - rect.left;
    const startY = e.clientY - rect.top;
    const selEl  = document.createElement('div');
    selEl.className = 'selection-rect';
    selEl.style.cssText = `left:${startX}px;top:${startY}px;width:0;height:0`;
    overlayEl.appendChild(selEl);
    _drag = { overlayEl, pageNum, startX, startY, selEl };
  });
}

// ── Render all pages ─────────────────────────────────────────────────────────
async function renderPages() {
  const chapterTitle = document.getElementById('chapter-title').value.trim();
  if (!chapterTitle || !_pdfFilename) return;

  _processing = true;
  _pageResults = [];
  _clips = [];
  _clipCounter = 0;

  document.getElementById('pages-grid').innerHTML = '';
  document.getElementById('clips-container').innerHTML = '';
  document.getElementById('pages-section').style.display = 'none';
  document.getElementById('clips-section').style.display = 'none';
  document.getElementById('commit-footer').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-bar-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = 'Loading PDF…';

  let pdfDoc;
  try {
    const file = document.getElementById('pdf-input').files[0];
    pdfDoc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  } catch (e) {
    document.getElementById('progress-text').textContent = `Error loading PDF: ${e.message}`;
    _processing = false;
    return;
  }

  const total = pdfDoc.numPages;
  const grid  = document.getElementById('pages-grid');
  document.getElementById('pages-section').style.display = 'block';

  for (let p = 1; p <= total; p++) {
    document.getElementById('progress-text').textContent = `Rendering page ${p} of ${total}…`;

    try {
      const { dataUrl, imgWidth, imgHeight } = await renderPage(pdfDoc, p);
      _pageResults.push({ pageNum: p, dataUrl, imgWidth, imgHeight });

      const wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.innerHTML = `
        <div class="page-label">
          PAGE ${p}
          <span class="page-hint">Drag to select a chart or diagram</span>
        </div>
        <div class="page-img-container" id="page-container-${p}">
          <img src="${dataUrl}" alt="Page ${p}" draggable="false">
          <div class="page-overlay" id="page-overlay-${p}"></div>
        </div>`;
      grid.appendChild(wrap);

      const overlay = wrap.querySelector('.page-overlay');
      attachSelectOverlay(overlay, p);
    } catch (e) {
      console.warn(`Page ${p} render error:`, e.message);
    }

    const pct = Math.round((p / total) * 100);
    document.getElementById('progress-bar-fill').style.width = `${pct}%`;
  }

  document.getElementById('progress-text').textContent =
    `${total} pages rendered — drag on any page to select a chart or diagram.`;
  document.getElementById('commit-footer').style.display = 'flex';
  updateClipCount();
  _processing = false;
}

// ── finalKnowledge compiler ───────────────────────────────────────────────────
function buildFinalKnowledge(clip) {
  const parts = [`=== Page ${clip.pageNum}, Clip #${clip.seq} ===`, clip.aiInterpretation];
  if (clip.userRefinement && clip.userRefinement.trim()) {
    parts.push(`[Trader's notes]: ${clip.userRefinement.trim()}`);
  }
  return parts.join('\n\n');
}

// ── Commit ────────────────────────────────────────────────────────────────────
async function commitChapter() {
  const token        = getGithubToken();
  const chapterTitle = document.getElementById('chapter-title').value.trim();
  if (!token || !chapterTitle || _clips.length === 0) return;

  const commitBtn = document.getElementById('commit-btn');
  const statusEl  = document.getElementById('commit-status');
  commitBtn.disabled   = true;
  statusEl.className   = '';
  statusEl.textContent = 'Committing…';

  try {
    let data = { chapters: [] };
    try {
      const existing = await loadChapterKnowledge(token);
      if (existing) { data = existing.content; _chSha = existing.sha; }
    } catch (_) {}

    const newChapter = {
      title:     chapterTitle,
      filename:  _pdfFilename,
      committed: new Date().toISOString(),
      clips: _clips.map(c => ({
        pageNum:          c.pageNum,
        seq:              c.seq,
        aiInterpretation: c.aiInterpretation,
        userRefinement:   c.userRefinement,
        finalKnowledge:   buildFinalKnowledge(c),
      })),
    };

    const idx = data.chapters.findIndex(c => c.filename === _pdfFilename);
    if (idx >= 0) data.chapters[idx] = newChapter;
    else          data.chapters.push(newChapter);

    await saveChapterKnowledge(token, data);

    statusEl.className   = 'ok';
    statusEl.textContent = `✓ Committed ${_clips.length} clips to GitHub!`;
    renderChapterList(data);
    setTimeout(() => { statusEl.textContent = ''; }, 5000);
  } catch (e) {
    statusEl.className   = 'err';
    statusEl.textContent = `Error: ${e.message}`;
  } finally {
    commitBtn.disabled = _clips.length === 0;
  }
}

// ── Global drag handlers (single set, handles all pages) ─────────────────────
document.addEventListener('mousemove', e => {
  if (!_drag) return;
  const rect = _drag.overlayEl.getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
  const y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
  const w = x - _drag.startX, h = y - _drag.startY;
  _drag.selEl.style.left   = (w < 0 ? x : _drag.startX) + 'px';
  _drag.selEl.style.top    = (h < 0 ? y : _drag.startY) + 'px';
  _drag.selEl.style.width  = Math.abs(w) + 'px';
  _drag.selEl.style.height = Math.abs(h) + 'px';
});

document.addEventListener('mouseup', async e => {
  if (!_drag) return;
  const { overlayEl, pageNum, startX, startY, selEl } = _drag;
  const rect   = overlayEl.getBoundingClientRect();
  const x      = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
  const y      = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
  const left   = Math.min(startX, x);
  const top    = Math.min(startY, y);
  const width  = Math.abs(x - startX);
  const height = Math.abs(y - startY);
  selEl.remove();
  _drag = null;
  if (width < 30 || height < 30) return; // too small, ignore accidental click
  await createClip(pageNum, left, top, width, height, rect.width, rect.height);
});

// ── Event wiring ──────────────────────────────────────────────────────────────
function wireEvents() {
  document.getElementById('keys-toggle-btn').addEventListener('click', () => {
    const f = document.getElementById('keys-fields');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('anthropic-save-btn').addEventListener('click', () => {
    const v = document.getElementById('anthropic-key-input').value.trim();
    if (v) { saveAnthropicKey(v); document.getElementById('anthropic-key-input').value = ''; }
    updateKeysCardState();
  });
  document.getElementById('gh-token-save-btn').addEventListener('click', async () => {
    const v = document.getElementById('gh-token-input').value.trim();
    if (v) { saveGithubToken(v); document.getElementById('gh-token-input').value = ''; }
    updateKeysCardState();
    const token = getGithubToken();
    if (token) {
      renderChapterList(null);
      try {
        const result = await loadChapterKnowledge(token);
        if (result) { _chSha = result.sha; renderChapterList(result.content); }
        else renderChapterList({ chapters: [] });
      } catch(e) { renderChapterList(null, e.message); }
    }
  });

  document.getElementById('pdf-input').addEventListener('change', function() {
    const file = this.files[0];
    _pdfFilename = file ? file.name : '';
    document.getElementById('filename-display').textContent = _pdfFilename;
    if (file && document.getElementById('chapter-title').value.trim()) {
      renderPages();
    }
  });

  document.getElementById('chapter-title').addEventListener('change', () => {
    if (_pdfFilename && document.getElementById('chapter-title').value.trim()) {
      renderPages();
    }
  });

  // Delegated: clip textarea
  document.getElementById('clips-container').addEventListener('input', e => {
    if (e.target.matches('.clip-textarea')) {
      const id  = parseInt(e.target.dataset.clipId, 10);
      const clip = _clips.find(c => c.id === id);
      if (clip) clip.userRefinement = e.target.value;
    }
  });

  // Delegated: remove clip button
  document.getElementById('clips-container').addEventListener('click', e => {
    const btn = e.target.closest('button[data-clip-id]');
    if (!btn) return;
    const id = parseInt(btn.dataset.clipId, 10);
    _clips = _clips.filter(c => c.id !== id);
    document.getElementById(`clip-card-${id}`)?.remove();
    updateClipCount();
    if (_clips.length === 0) document.getElementById('clips-section').style.display = 'none';
  });

  document.getElementById('commit-btn').addEventListener('click', commitChapter);
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  updateKeysCardState();
  wireEvents();
  const token = getGithubToken();
  if (token) {
    try {
      const result = await loadChapterKnowledge(token);
      if (result) { _chSha = result.sha; renderChapterList(result.content); }
      else renderChapterList({ chapters: [] });
    } catch(e) { renderChapterList(null, e.message); }
  } else {
    renderChapterList({ chapters: [] });
  }
});
</script>
